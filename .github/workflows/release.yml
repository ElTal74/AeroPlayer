# Compila AERO Player para Windows, Linux y macOS y publica la versión con todas las descargas y un único
# SHA256SUMS.txt (el que usa el actualizador). Se lanza al subir una etiqueta «v1.2.0»… (o a mano desde Actions).
name: Versión

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - uses: dtolnay/rust-toolchain@stable
      - name: Dependencias
        run: |
          python -m venv .venv
          .venv\Scripts\python -m pip install --upgrade pip
          .venv\Scripts\pip install -r requirements-dev.txt
      - name: Comprobaciones rápidas
        run: |
          .venv\Scripts\python -m ruff check aero tests tools
          .venv\Scripts\python tools\i18n_keys.py --strict
      - name: Certificado de firma (solo si está configurado como secreto)
        env:
          PFX_B64: ${{ secrets.AERO_SIGN_PFX_BASE64 }}
        if: env.PFX_B64 != ''
        run: |
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\firma.pfx", [Convert]::FromBase64String($env:PFX_B64))
          "AERO_SIGN_PFX=$env:RUNNER_TEMP\firma.pfx" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - name: Compilar (núcleo Rust, programa, instalador y portable)
        env:
          AERO_SIGN_PASSWORD: ${{ secrets.AERO_SIGN_PASSWORD }}
        run: powershell -ExecutionPolicy Bypass -File packaging\build.ps1 -SkipTests
      - name: Comprobar el ejecutable
        run: |
          dist\AeroPlayer\AeroPlayer.exe --diagnostico diag.json
          Start-Sleep 5
          Get-Content diag.json
          $d = Get-Content diag.json -Raw | ConvertFrom-Json
          if (-not $d.qt_completo) { throw "Al ejecutable le falta un módulo de Qt (visor PDF o multimedia)." }
      - name: Sumas de Windows
        run: Move-Item dist\SHA256SUMS.txt dist\SHA256SUMS-windows.txt
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/AeroPlayer-*-setup.exe
            dist/AeroPlayer-*-portable.zip
            dist/SHA256SUMS-windows.txt

  unix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - uses: dtolnay/rust-toolchain@stable
      - name: Bibliotecas del sistema (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-xinerama0 libxcb-xkb1 libxcb-xfixes0 libpulse0 libfontconfig1 libdbus-1-3
      - name: Dependencias
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements-dev.txt
      - name: Compilar
        env:
          PY: .venv/bin/python
        run: bash packaging/build_unix.sh
      - name: Comprobar el ejecutable
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then EXE=dist/AeroPlayer.app/Contents/MacOS/AeroPlayer; else EXE=dist/AeroPlayer/AeroPlayer; fi
          "$EXE" --diagnostico diag.json
          cat diag.json
          python3 -c "import json,sys; d=json.load(open('diag.json')); sys.exit(0 if d['qt_completo'] else 1)"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ runner.os }}
          path: |
            dist/*.tar.gz
            dist/*.dmg
            dist/SHA256SUMS-*.txt

  publish:
    needs: [windows, unix]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Un único SHA256SUMS.txt y las notas de la versión
        run: |
          # sin BOM ni retornos de Windows en medio del archivo (el actualizador lee la línea del instalador)
          cat dist/SHA256SUMS-*.txt | tr -d '\r' | sed 's/^\xEF\xBB\xBF//; s/ \*/  /' > dist/SHA256SUMS.txt
          cat dist/SHA256SUMS.txt
          python3 tools/release_notes.py ${{ github.ref_name }} notas.md
      - name: Publicar la versión
        uses: softprops/action-gh-release@v2
        with:
          name: AERO Player ${{ github.ref_name }}
          body_path: notas.md
          files: |
            dist/AeroPlayer-*-setup.exe
            dist/AeroPlayer-*-portable.zip
            dist/AeroPlayer-*-linux-*.tar.gz
            dist/AeroPlayer-*-macos-*.dmg
            dist/SHA256SUMS.txt
