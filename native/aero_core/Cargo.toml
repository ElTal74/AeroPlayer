[package]
name = "aero_core"
version = "0.2.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Núcleo nativo de AERO Player: listar carpetas, clasificar archivos, estadísticas y búsqueda"
publish = false

[lib]
name = "aero_core"
crate-type = ["cdylib"]

[dependencies]
# abi3: una sola .pyd válida para Python 3.11 y posteriores (incluido 3.14)
pyo3 = { version = "0.27", features = ["extension-module", "abi3-py311"] }
unicode-normalization = "0.1"
lofty = "0.25"
rayon = "1.12"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
